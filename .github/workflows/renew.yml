name: Auto Renew FridayDev Service

on:
  workflow_dispatch:
  schedule:
    # 每日北京 15:05（UTC 07:05）—— 倒计时剩 ≤2 天即可续，每日一跑足够
    - cron: '5 7 * * *'

permissions:
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright patchright
          playwright install chromium
          playwright install-deps chromium
          # patchright 自帶 Chromium（唔會同 playwright 撞），ARM 失敗會自己報錯
          python -m patchright install chromium || echo '[WARN] patchright chromium 裝唔到，會退回 playwright'

      - name: Run Auto Renew Script
        env:
          COOKIE: ${{ secrets.COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python renew.py

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-screenshot
          path: result.png
          if-no-files-found: ignore
