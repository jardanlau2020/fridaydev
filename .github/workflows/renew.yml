name: Auto Renew Friday

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  Renew-friday:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # 代理步骤挪到 Checkout 之前（冷王改动 2）：Checkout 带
      # persist-credentials: true，token 会落进 .git/config；脚本能写
      # $GITHUB_ENV（存档版第 11、462、463 行），顺序反了就能劫持后面
      # 握着 COOKIE_VALUE / GH_TOKEN / TG_BOT_TOKEN 的那一步。
      #
      # 脚本不再从第三方站点拉：用我们仓库里固定 commit 的
      # .github/scripts/setup_proxy.sh，再对内容做 sha256 校验。
      #
      # 校验单独一步、不带 continue-on-error：脚本被改 → 硬停。
      - name: ⬇ 取回并校验代理脚本
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/setup_proxy.sh" -o /tmp/setup_proxy.sh
          echo "126c9f2473f2e94bf1b8e1e1d09fa97eedeb1a80c3f110b90c4b59a58b8c9981  /tmp/setup_proxy.sh" | sha256sum -c -

      - name: ⚙ 设置代理（逐节点验出口纯净度）
        continue-on-error: true
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
        run: |
          # 按速度挑的第一个节点出口是 104.28.155.210（Cloudflare 自己的段），
          # Turnstile 见机房 IP 直接不给票据 —— 点多少次复选框都没用。
          # 所以改成连上之后先验出口身份：hosting/proxy 为 true 的直接跳过。
          # 必须在工作区之外跑：actions/checkout 会先 Deleting the contents of
          # <workspace> 再 git init，sing-box 二进制放工作区会被删掉。
          curl -fsSL "$HOME_SUB_URL" -A 'clash-verge/v2.0' -o /tmp/home_sub.yaml
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/pick_node.py" -o /tmp/pick_node.py
          python3 /tmp/pick_node.py /tmp/home_sub.yaml 40 > /tmp/nodes.txt
          total=$(wc -l < /tmp/nodes.txt)
          echo "候选节点数: $total"
          : > /tmp/exit_report.txt
          mkdir -p /tmp/fdproxy
          cd /tmp/fdproxy
          n=0
          clean=0
          while IFS= read -r uri; do
            n=$((n+1))
            echo "──── 测试节点 $n/$total ────"
            if ! NODE_LINK="$uri" bash /tmp/setup_proxy.sh; then
              echo "节点 $n 连不通"
              echo "node$n | 连不通" >> /tmp/exit_report.txt
              continue
            fi
            info=$(curl -s --max-time 20 -x socks5h://127.0.0.1:1080 \
              'http://ip-api.com/json/?fields=status,query,country,isp,org,as,hosting,proxy,mobile' || echo '{}')
            echo "出口信息: $info"
            ip=$(echo "$info" | jq -r '.query // "?"')
            isp=$(echo "$info" | jq -r '.isp // "?"')
            hosting=$(echo "$info" | jq -r '.hosting // true')
            proxied=$(echo "$info" | jq -r '.proxy // true')
            echo "node$n | $ip | $isp | hosting=$hosting proxy=$proxied" >> /tmp/exit_report.txt
            if [ "$hosting" = "false" ] && [ "$proxied" = "false" ]; then
              echo "✅ 节点 $n 出口干净（hosting=false proxy=false）"
              clean=1
              break
            fi
            echo "节点 $n 出口不干净，换下一个"
            pkill -f sing-box 2>/dev/null || true
            fuser -k 1080/tcp 2>/dev/null || true
            sleep 1
          done < /tmp/nodes.txt

          echo "════ 出口清单 ════"
          cat /tmp/exit_report.txt
          if [ "$clean" != "1" ]; then
            # 没有干净出口时，sing-box 已经被杀掉了；但前面成功的节点已经把
            # IS_PROXY=true 写进 $GITHUB_ENV，会让 app.py 拿着一个死代理跑
            # （run 44900742055：ERR_PROXY_CONNECTION_FAILED）。这里改回 false，
            # 让 app.py 至少走直连、能留下真实证据。
            pkill -f sing-box 2>/dev/null || true
            fuser -k 1080/tcp 2>/dev/null || true
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "❌ 没有找到干净出口（已回退直连）"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          # 代理步骤在 Checkout 之前，sing-box 二进制 / 配置是未跟踪文件；
          # 默认 clean: true 会跑 git clean -ffdx 把它们清掉，后面版本核对
          # 就会 ./sing-box: No such file。runner 每次全新，关掉安全。
          clean: false

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 🔍 静态检查（未定义变量，如 NameError 类 bug）
        run: |
          pip install ruff
          ruff check --select F821,F822,F823 app.py

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq wget
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      - name: 🔎 核对 sing-box 版本
        run: |
          if [ ! -x /tmp/fdproxy/sing-box ]; then
            if [ "${IS_PROXY:-false}" = "true" ]; then
              echo "IS_PROXY=true 但 /tmp/fdproxy/sing-box 不存在"; exit 1
            fi
            echo "[WARN] 没有 sing-box（直连模式），跳过版本核对"; exit 0
          fi
          /tmp/fdproxy/sing-box version | grep -q "1.14.4" || { echo "sing-box 版本不符，中止"; exit 1; }

      - name: 🚀 运行续期脚本
        env:
          COOKIE: ${{ secrets.COOKIE }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u app.py

      # 更新时间到 time.txt，避免 6 个月未更新导致工作流暂停。
      # time.txt 只是防休眠的时间戳：push 撞上 main 被推进（non-fast-forward）
      # 不值得让整个 job 报红 —— 续期本身已经成功，红只会让人误判。
      - name: 🕒 更新时间
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            # main 可能在本次 job 跑的过程中被合并推进（PR #7 那次就是），
            # 直接 push 会 `! [rejected] main -> main (fetch first)`，功能成功、
            # 整个 run 却报红。push 前先 rebase 到最新 main。
            git pull --rebase origin main
            git push origin main
          fi

      - name: 📸 上传结果截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-result
          path: result.png
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f patchright || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log result.png
          rm -rf /tmp/fdproxy

      # 原来这里有一整步「清理旧的工作流运行记录」，把历史 run 删到只剩 1 条，
      # 出事连审计证据都没了 —— 已整步删除，不保留任何自动删除。
