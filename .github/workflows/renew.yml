name: Auto Renew FridayDev Service

# 2026-10-02：改用 renew-kit 的 composite action（依赖安装 / renewkit 注入 /
# 失败兜底统一走公共骨架）。脚本本身同日迁到 renewkit，退出码从 0/1/2/3
# 收敛成 0/1 —— 见 renew.py 顶註。
#
# 模式说明（2026-10-06 起）：
#   renew（默認）= 自動續期。續期按鈕只會喺可續窗口內先出現，未到窗口照樣
#                 skip 唔撳；Turnstile 由「有頭真 Chrome + xvfb」跑（見 setup-command）。
#   watchdog     = 只讀狀態 + 到期前 TG 提醒，唔撳任何嘢（要只讀先人手 dispatch 揀）。
#
# 點解以前 default 係 watchdog（保留俾以後嘅自己睇）：
# 2026-09-24 起「GHA 每日自動撳只會製造紅燈」，實證 run 35510050597 ——
# 428 攞到 captcha_site_key，但頁內 window.turnstile 全程 undefined、
# iframes=[]，即 Turnstile 喺 **headless** Chromium 下根本唔 render。
# 2026-10-06 改用 xvfb + channel="chrome" + headless=False（HidenCloud 10-05
# 同款配方），實測引擎起得到、面板讀得到，用戶拍板「改做 renew → 全自動」。
# ⚠️ 但 Turnstile 本身**仍未被真正觸發過**：10-06 兩單 dispatch 時面板顯示
#    「Renouvelable dans 3 jour(s)」、冇按鈕，腳本按設計 skip。
#    首次真驗證要等可續窗口開（下次 2026-10-08）。未證實之前唔好寫「已解決」。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'renew = 自動續期（默認）；watchdog = 只讀+到期提醒，唔撳任何嘢'
        required: false
        default: 'renew'
        type: choice
        options:
          - watchdog
          - renew
      dry_run:
        description: '只檢查不發 TG（用來驗證流程與文案）'
        type: boolean
        default: false
  schedule:
    # 每日自動續期（2026-10-06 起）：renew 模式 —— 有續期按鈕就撳，未到窗口
    # 就 skip 唔撳。通知節奏：續期成功發一條 ok；剩 ≤2 日仍未可續就提你；
    # >2 日完全靜默。
    # （2026-09-24 → 2026-10-05 期間係 watchdog，只提醒唔撳，原因見上面頭註。）
    #
    # cron 写的是 UTC 07:05（北京 15:05），但**别指望这个时间**：
    # GitHub 的 schedule 触发器是 best-effort，免费 runner 上会排队。
    # 实测落地时间（run #21–#31）全在 UTC 12:40–15:19，即北京 20:40–23:19，
    # 迟 5.5–8 小时，偶尔更晚。可續窗口跨越多日而每日都會跑一次，所以遲
    # 幾小時有補償空間、無害；真要它落在某个钟点，得把 cron 往前挪几小时来补偿。
    - cron: '5 7 * * *'

# 原来这里写着 `permissions: actions: write`，但本仓库没有任何一步调 GitHub API
# （既不做 cron 回写，也没有清理运行记录）—— 那是一条没人用的额外授权，
# 第三方 action 也能继承。删掉，只留 checkout 需要的默认 contents: read。

jobs:
  renew:
    name: FridayDev 續期守門
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 运行续期脚本（renew-kit）
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.5.3
        env:
          COOKIE: ${{ secrets.COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 默認 renew（2026-10-06 起全自動）。
          # 排程觸發時 inputs 為空 → 落到 'renew'，即係每日真試續期；
          # 要只讀守門先人手 dispatch 揀 mode=watchdog。
          FD_MODE: ${{ inputs.mode || 'renew' }}
          # 演练开关：renewkit.notify.send 里唯一的闸门，设了就只打印不发。
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # 有頭用嘅虛擬顯示（xvfb-run --server-num=99 同呢個數字對齊）。
          # 規程：起咗 Xvfb 但冇 DISPLAY = 白起。
          DISPLAY: ':99'
        with:
          script: renew.py
          python-version: "3.10"
          renewkit-ref: v0.5.3
          pip-packages: playwright patchright
          # Xvfb：Turnstile 喺 headless Chromium 拒絕渲染（run 35510050597：
          # window.turnstile 全程 undefined、iframes=[]），要用有頭先會 render。
          apt-packages: xvfb
          # 用 xvfb-run 包住跑 → DISPLAY 由佢設定，配合 env DISPLAY=:99。
          # 對齊 HidenCloud 10-05 嗰單成功配方（xvfb + 真 Chrome + headed）。
          command: xvfb-run --server-num=99 -s "-screen 0 1920x1080x24" python -u renew.py
          # 浏览器安装放这里，跟迁移前逐条对齐：
          #   · playwright install chromium        —— 主引擎
          #   · playwright install-deps chromium   —— 系统库（内部自己 sudo）
          #   · patchright 自帶 Chromium（唔會同 playwright 撞），ARM 失敗會自己報錯
          #   · 真 Chrome（channel="chrome"）—— ubuntu-latest 預裝；冇就要講俾我哋知，
          #     否則腳本會靜默退回 chromium，「有頭真 Chrome」呢半邊就白做。
          # setup-continue-on-error 设 false：迁移前这几条失败就是硬失败，
          # 不改成软失败（软失败只会把问题推迟到脚本里，报错更难读）。
          setup-command: |
            playwright install chromium
            playwright install-deps chromium
            python -m patchright install chromium || echo '[WARN] patchright chromium 裝唔到，會退回 playwright'
            echo "── 真 Chrome 檢查（channel=chrome 要用）──"
            google-chrome --version || google-chrome-stable --version || echo "[ERROR] runner 冇真 Chrome，會退回 chromium"
            command -v xvfb-run && xvfb-run --help 2>&1 | head -2
          setup-continue-on-error: "false"
          # 关掉 action 的兜底通知：脚本对每种结局（cookie 失效 / 点唔到按钮 /
          # API 未回 success / 未捕获异常）都已经自己发过 TG，兜底那条会重复。
          notify-on-failure: "false"
          # 产物上传不用 action 的（它只在 failure() 时传）；本仓库迁移前是
          # `if: always()`，见下面单独那步。

      - name: 上传截图产物
        # 迁移前就是 always()：成功那次的截图同样有参考价值（比如看「未到窗口」
        # 时面板到底长什么样）。所以不走 action 的失败才传。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fridaydev-screenshot
          path: result.png
          if-no-files-found: ignore
