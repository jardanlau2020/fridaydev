name: Auto Renew Friday

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  Renew-friday:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # 代理步骤挪到 Checkout 之前（冷王改动 2）：Checkout 带
      # persist-credentials: true，token 会落进 .git/config；脚本能写
      # $GITHUB_ENV（存档版第 11、462、463 行），顺序反了就能劫持后面
      # 握着 COOKIE_VALUE / GH_TOKEN / TG_BOT_TOKEN 的那一步。
      #
      # 脚本不再从第三方站点拉：用我们仓库里固定 commit 的
      # .github/scripts/setup_proxy.sh，再对内容做 sha256 校验。
      #
      # 校验单独一步、不带 continue-on-error：脚本被改 → 硬停。
      - name: ⬇ 取回并校验代理脚本
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/setup_proxy.sh" -o /tmp/setup_proxy.sh
          echo "126c9f2473f2e94bf1b8e1e1d09fa97eedeb1a80c3f110b90c4b59a58b8c9981  /tmp/setup_proxy.sh" | sha256sum -c -

      # 2026-11-23 换掉 sing-box：原路径靠 pick_node.py 只挑 vless/trojan，
      # 而这 135 条订阅里 vless/trojan（63 条）的出口全是 Cloudflare WARP
      # （hosting=true proxy=true，Turnstile 不给票）；真住宅在 68 条 openvpn 里，
      # sing-box 不认 openvpn，所以原路永远 clean=0。改用 mihomo（认 openvpn），
      # 实现照 openworld 的 renew-openworld.yml。
      #
      # 失败策略对齐 openworld：配了订阅却拉不起干净出口 → 直接判本轮失败，
      # 不回落直连硬撞验证码（不写 IS_PROXY=false）。没配订阅才跳过走直连。
      - name: 🏠 启动家宽出口（mihomo）
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOME_SUB_URL:-}" ]; then
            echo "⚪ 未配置 HOME_SUB_URL，跳过家宽出口（走直连）"
            exit 0
          fi

          MIHOMO_VERSION=1.19.34
          WORK=/tmp/fdproxy
          mkdir -p "$WORK"
          cd "$WORK"

          echo "⬇️ 下载 mihomo ${MIHOMO_VERSION}"
          curl -fsSL --retry 3 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          # 校验值取自 GitHub release asset 官方 digest（v1.19.34, 22731319 bytes）
          echo "223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc  mihomo.gz" | sha256sum -c -
          gunzip -f mihomo.gz
          mv mihomo mihomo-bin
          chmod +x mihomo-bin

          mkdir -p mihomo-home
          if ! curl -fsSL --retry 2 --max-time 60 -o mihomo-home/config.yaml "$HOME_SUB_URL"; then
            echo "❌ 订阅下载失败"
            exit 1
          fi

          # 订阅的 rules 是 MATCH,🚀 节点选择，但这个组在订阅里不存在
          # （只有 ⚡ CF前置 / 🏠 家宽自动 / 🏠 家宽节点）—— 不改的话默认流量
          # 落到直连/第一个组，等于没走家宽。直接改指 🏠 家宽自动（fallback 自选）。
          CP_BEFORE=$(md5sum mihomo-home/config.yaml | cut -d' ' -f1)
          sed -i 's|^\(  - MATCH,\).*$|\1🏠 家宽自动|' mihomo-home/config.yaml
          CP_AFTER=$(md5sum mihomo-home/config.yaml | cut -d' ' -f1)
          if [ "$CP_BEFORE" = "$CP_AFTER" ]; then
            echo "⚠️ rules 里没找到 MATCH 行，配置未改动"
          else
            echo "✅ rules 已改：MATCH -> 🏠 家宽自动"
          fi
          grep -n 'MATCH' mihomo-home/config.yaml || true

          echo "--- proxies 统计 ---"
          echo "openvpn 节点: $(grep -c 'type: openvpn' mihomo-home/config.yaml || true)"
          echo "节点条目: $(grep -cE '^[[:space:]]*- name:' mihomo-home/config.yaml || true)"

          nohup ./mihomo-bin -d ./mihomo-home -f ./mihomo-home/config.yaml > mihomo.log 2>&1 &
          sleep 8
          if ! ss -tuln | grep -q ':7890'; then
            echo "❌ mihomo 没起来，日志如下"
            cat mihomo.log || true
            exit 1
          fi

          DIRECT_IP="$(curl -s --max-time 8 https://api.ipify.org || echo '')"
          PROXY_IP="$(curl -s --max-time 25 -x http://127.0.0.1:7890 https://api.ipify.org || echo '')"
          echo "📡 直连出口 IP: ${DIRECT_IP:-未知}"
          echo "📡 家宽出口 IP: ${PROXY_IP:-未知}"
          if [ -z "$PROXY_IP" ]; then
            echo "❌ 家宽出口不通，直接失败退出（不白跑）"
            exit 1
          fi
          if [ "$PROXY_IP" = "$DIRECT_IP" ]; then
            echo "❌ 出口 IP 与直连相同，代理没生效，失败退出"
            exit 1
          fi

          info=$(curl -s --max-time 20 -x http://127.0.0.1:7890 \
            'http://ip-api.com/json/?fields=status,query,country,isp,org,as,hosting,proxy' || echo '{}')
          echo "出口详情: $info"
          # jq 优先，没装就退回 grep —— GHA 的 ubuntu runner 自带 jq，这里只是兜底。
          if command -v jq >/dev/null 2>&1; then
            get_hosting() { echo "$1" | jq -r '.hosting | tostring'; }
          else
            get_hosting() { echo "$1" | grep -o '"hosting":[^,}]*' | cut -d: -f2 | tr -d ' '; }
          fi
          hosting=$(get_hosting "$info")
          if [ "$hosting" != "false" ]; then
            echo "⚠️ 出口不是住宅（hosting=$hosting），尝试把 🏠 家宽节点 切到具体节点"
            SEL=$(python3 -c "import urllib.parse;print(urllib.parse.quote('🏠 家宽节点'))")
            for NODE in "🏠 JP-家宽-01" "🏠 JP-家宽-02" "🏠 KR-家宽-01" "🏠 JP-家宽-03"; do
              NODE_JSON=$(python3 -c "import json,sys;print(json.dumps({'name':sys.argv[1]},ensure_ascii=False))" "$NODE")
              curl -s -X PUT "http://127.0.0.1:9090/proxies/$SEL" \
                -H "Content-Type: application/json" --data-binary "$NODE_JSON" || true
              sleep 4
              info=$(curl -s --max-time 20 -x http://127.0.0.1:7890 \
                'http://ip-api.com/json/?fields=status,query,country,isp,org,as,hosting,proxy' || echo '{}')
              echo "切到 $NODE 后: $info"
              hosting=$(get_hosting "$info")
              [ "$hosting" = "false" ] && break
            done
          fi
          if [ "$hosting" != "false" ]; then
            echo "❌ 仍拿不到住宅出口（hosting=$hosting），本轮失败退出"
            exit 1
          fi

          echo "✅ 家宽出口就绪：$PROXY_IP"
          # 只让业务请求走代理；GitHub / Telegram 走直连，避免 GITHUB_TOKEN 等
          # Bearer 走第三方住宅出口（同 openworld 的 NO_PROXY 白名单）。
          NO_PROXY_LIST="localhost,127.0.0.1,::1,github.com,githubusercontent.com,api.telegram.org"
          echo "IS_PROXY=true"                      >> "$GITHUB_ENV"
          echo "PROXY_SERVER=http://127.0.0.1:7890" >> "$GITHUB_ENV"
          echo "HTTP_PROXY=http://127.0.0.1:7890"   >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://127.0.0.1:7890"  >> "$GITHUB_ENV"
          echo "ALL_PROXY=http://127.0.0.1:7890"    >> "$GITHUB_ENV"
          echo "NO_PROXY=$NO_PROXY_LIST"            >> "$GITHUB_ENV"
          echo "no_proxy=$NO_PROXY_LIST"            >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          # 代理步骤在 Checkout 之前，mihomo 二进制 / 配置在 /tmp/fdproxy（工作区外）；
          # 默认 clean: true 会跑 git clean -ffdx，工作区里的未跟踪文件会被清掉，
          # 这里继续关掉，避免误伤。
          clean: false

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 🔍 静态检查（未定义变量，如 NameError 类 bug）
        run: |
          pip install ruff
          ruff check --select F821,F822,F823 app.py

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq wget
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      - name: 🔎 核对 mihomo 版本
        run: |
          if [ ! -x /tmp/fdproxy/mihomo-bin ]; then
            if [ "${IS_PROXY:-false}" = "true" ]; then
              echo "IS_PROXY=true 但 /tmp/fdproxy/mihomo-bin 不存在"
              exit 1
            fi
            echo "[WARN] 没有 mihomo（直连模式），跳过版本核对"
            exit 0
          fi
          /tmp/fdproxy/mihomo-bin -v | grep -q "1.19.34" || { echo "mihomo 版本不符，中止"; exit 1; }

      # 告警状态：一天最多一条靠它。GHA 每次都是新容器，不留 state 就天天重发。
      - name: ♻️ 恢复告警状态（一天一条）
        uses: actions/cache/restore@v4
        with:
          path: fd_alert_state.json
          key: fdalert-${{ github.run_id }}
          restore-keys: |
            fdalert-

      - name: 🚀 运行续期脚本
        env:
          COOKIE: ${{ secrets.COOKIE }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u app.py

      - name: 💾 保存告警状态
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: fd_alert_state.json
          key: fdalert-${{ github.run_id }}

      # 更新时间到 time.txt，避免 6 个月未更新导致工作流暂停。
      # time.txt 只是防休眠的时间戳：push 撞上 main 被推进（non-fast-forward）
      # 不值得让整个 job 报红 —— 续期本身已经成功，红只会让人误判。
      #
      # 只在 main 上提交：分支 dispatch 时 `git pull --rebase origin main` 会把
      # PR 自己的提交重放到 main 上，跟 main 的 app.py 撞 add/add 冲突
      # （run 44903339200 实测），既推不上去也没意义。
      - name: 🕒 更新时间
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            # main 可能在本次 job 跑的过程中被合并推进（PR #7 那次就是），
            # 直接 push 会 `! [rejected] main -> main (fetch first)`，功能成功、
            # 整个 run 却报红。push 前先 rebase 到最新 main。
            git pull --rebase origin main
            git push origin main
          fi

      - name: 📸 上传结果截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-result
          path: result.png
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f mihomo || true
          pkill -f sing-box || true
          pkill -f patchright || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log result.png
          rm -rf /tmp/fdproxy

      # 原来这里有一整步「清理旧的工作流运行记录」，把历史 run 删到只剩 1 条，
      # 出事连审计证据都没了 —— 已整步删除，不保留任何自动删除。
