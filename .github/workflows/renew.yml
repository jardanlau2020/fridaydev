name: Auto Renew Friday

on:
  schedule:
    - cron: '30 23 * * 5'
  workflow_dispatch:

jobs:
  Renew-friday:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # 代理步骤挪到 Checkout 之前（冷王改动 2）：Checkout 带
      # persist-credentials: true，token 会落进 .git/config；脚本能写
      # $GITHUB_ENV（存档版第 11、462、463 行），顺序反了就能劫持后面
      # 握着 COOKIE_VALUE / GH_TOKEN / TG_BOT_TOKEN 的那一步。
      #
      # 脚本不再从第三方站点拉：用我们仓库里固定 commit 的
      # .github/scripts/setup_proxy.sh，再对内容做 sha256 校验。
      #
      # 校验单独一步、不带 continue-on-error：脚本被改 → 硬停。
      - name: ⬇ 取回并校验代理脚本
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/setup_proxy.sh" -o /tmp/setup_proxy.sh
          echo "126c9f2473f2e94bf1b8e1e1d09fa97eedeb1a80c3f110b90c4b59a58b8c9981  /tmp/setup_proxy.sh" | sha256sum -c -

      - name: ⚙ 设置代理 (sing-box，自动换节点)
        continue-on-error: true
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
        run: |
          # 单节点 NODE_LINK 是死节点（42.200.173.5:443 connection refused），
          # 改成从住宅订阅里挑 TCP 可达的节点逐条试，最多 12 条（job 只有 20 分钟）。
          # 必须在工作区之外跑：actions/checkout 会先 Deleting the contents of
          # <workspace> 再 git init，sing-box 二进制放工作区会被删掉。
          curl -fsSL "$HOME_SUB_URL" -A 'clash-verge/v2.0' -o /tmp/home_sub.yaml
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/pick_node.py" -o /tmp/pick_node.py
          python3 /tmp/pick_node.py /tmp/home_sub.yaml 12 > /tmp/nodes.txt
          total=$(wc -l < /tmp/nodes.txt)
          echo "候选节点数: $total"
          if [ "$total" -eq 0 ]; then echo "没有可达节点，中止"; exit 1; fi
          mkdir -p /tmp/fdproxy
          cd /tmp/fdproxy
          n=0
          ok=0
          while IFS= read -r uri; do
            n=$((n+1))
            echo "──── 尝试节点 $n/$total ────"
            if NODE_LINK="$uri" bash /tmp/setup_proxy.sh; then
              ok=1
              echo "✅ 节点 $n 连通"
              break
            fi
            echo "节点 $n 不通，换下一个"
          done < /tmp/nodes.txt
          if [ "$ok" != "1" ]; then echo "❌ 所有候选节点都不通"; exit 1; fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          # 代理步骤在 Checkout 之前，sing-box 二进制 / 配置是未跟踪文件；
          # 默认 clean: true 会跑 git clean -ffdx 把它们清掉，后面版本核对
          # 就会 ./sing-box: No such file。runner 每次全新，关掉安全。
          clean: false

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 🔍 静态检查（未定义变量，如 NameError 类 bug）
        run: |
          pip install ruff
          ruff check --select F821,F822,F823 app.py

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq wget
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      - name: 🔎 核对 sing-box 版本
        run: |
          if [ ! -x /tmp/fdproxy/sing-box ]; then
            if [ "${IS_PROXY:-false}" = "true" ]; then
              echo "IS_PROXY=true 但 /tmp/fdproxy/sing-box 不存在"; exit 1
            fi
            echo "[WARN] 没有 sing-box（直连模式），跳过版本核对"; exit 0
          fi
          /tmp/fdproxy/sing-box version | grep -q "1.14.4" || { echo "sing-box 版本不符，中止"; exit 1; }

      - name: 🚀 运行续期脚本
        env:
          COOKIE: ${{ secrets.COOKIE }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u app.py

      # 更新时间到 time.txt，避免 6 个月未更新导致工作流暂停
      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: 📸 上传结果截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-result
          path: result.png
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f patchright || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log result.png
          rm -rf /tmp/fdproxy

      # 原来这里有一整步「清理旧的工作流运行记录」，把历史 run 删到只剩 1 条，
      # 出事连审计证据都没了 —— 已整步删除，不保留任何自动删除。
