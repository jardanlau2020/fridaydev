name: FD Cookie Probe (read-only)

# 只读探针：问一次 /php/auth.php 的 isLoggedIn，判断 COOKIE 还活不活。
# 不登录浏览器、不点续期、不写 secret、不写仓库。用完即删。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 装依赖
        run: pip install -q requests patchright

      - name: 🔎 直连问 /php/auth.php
        id: direct
        env:
          COOKIE: ${{ secrets.COOKIE }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
        run: |
          set -uo pipefail
          python -u .github/scripts/probe_cookie.py direct || true
          echo "result=$(cat result.txt 2>/dev/null || echo inconclusive)" >> "$GITHUB_OUTPUT"

      - name: 🏠 起家宽出口（直连被拦时才用）
        id: egress
        if: steps.direct.outputs.result == 'inconclusive'
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOME_SUB_URL:-}" ]; then
            echo "⚪ 没有 HOME_SUB_URL，跳过"
            exit 0
          fi
          WORK=/tmp/fdproxy
          mkdir -p "$WORK" && cd "$WORK"
          curl -fsSL --retry 3 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz"
          echo "223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc  mihomo.gz" | sha256sum -c -
          gunzip -f mihomo.gz && mv mihomo mihomo-bin && chmod +x mihomo-bin
          mkdir -p mihomo-home
          curl -fsSL --retry 2 --max-time 60 -o mihomo-home/config.yaml "$HOME_SUB_URL"
          sed -i 's|^\(  - MATCH,\).*$|\1🏠 家宽自动|' mihomo-home/config.yaml
          nohup ./mihomo-bin -d ./mihomo-home -f ./mihomo-home/config.yaml > mihomo.log 2>&1 &
          sleep 8
          ss -tuln | grep -q ':7890' || { echo "⚠️ mihomo 没起来"; cat mihomo.log; exit 1; }
          echo "✅ 代理端口就绪"

      - name: 🔎 走家宽出口再问一次
        if: steps.direct.outputs.result == 'inconclusive'
        env:
          COOKIE: ${{ secrets.COOKIE }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
        run: |
          set -uo pipefail
          python -u .github/scripts/probe_cookie.py proxy || true
          echo "最终判定: $(cat result.txt 2>/dev/null || echo inconclusive)"

      - name: 🧽 清理
        if: always()
        run: pkill -f mihomo || true
